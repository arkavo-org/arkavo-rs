[workspace]
members = [".", "vendor/fpssdk", "crates/fairplay-wrapper"]
resolver = "2"

[package]
name = "arkavo-rs"
version = "0.9.5"
edition = "2021"
rust-version = "1.83.0"

[lib]
name = "nanotdf"
path = "src/lib.rs"

[[bin]]
name = "arks"
path = "src/bin/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 16

[profile.bench]
lto = true

[dependencies]
elliptic-curve = "0.13.8"
tokio = { version = "1.39.2", features = ["full"] }
tokio-tungstenite = "0.24.0"
futures-util = "0.3.30"
hex = "0.4.3"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0"
pem = "3.0.4"
aes-gcm = "0.10.3"
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa", "pkcs8", "pem"] }
once_cell = "1.19.0"
rand_core = "0.6.4"
sha2 = "0.10.8"
hmac = "0.12"
hkdf = "0.12.4"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
env_logger = "0.11.5"
log = "0.4.22"
ink = "5.0.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
async-nats = "0.51"
redis = { version = "0.27.2", features = ["tokio-comp"] }
flatbuffers = "24.12.23"
scale = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"], optional = true }
bs58 = "0.5.1"
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1.0", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
base64 = "0.22"
chrono = "0.4"
aws-config = { version = "1.5.13", features = ["behavior-version-latest"] }
# default-features off: the SDKs' "rustls" default pulls the legacy rustls 0.21 client (#135)
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
unicode-segmentation = "1"
uuid = { version = "1.11", features = ["v4"] }
fairplay-wrapper = { path = "crates/fairplay-wrapper", optional = true }
# stderr scrubbing for the FairPlay SDK's log lines (#83)
libc = { version = "0.2", optional = true }
c2pa = { version = "0.91", default-features = false, features = ["file_io", "rust_native_crypto", "http_ureq"], optional = true }
x509-parser = { version = "0.18", optional = true }
# CSR for the C2PA claim signing certificate (c2pa-csr); remote KMS key, so no crypto backend
rcgen = { version = "0.13", optional = true, default-features = false, features = ["pem"] }
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
mp4parse = { version = "0.17", optional = true }
# opentdf-rs v0.16.1 - NanoTDF and KAS support
# Source: https://github.com/arkavo-org/opentdf-rs/releases/tag/0.16.1
opentdf = { git = "https://github.com/arkavo-org/opentdf-rs", tag = "0.16.1" }
opentdf-crypto = { git = "https://github.com/arkavo-org/opentdf-rs", tag = "0.16.1", features = ["kem-ec"] }
opentdf-protocol = { git = "https://github.com/arkavo-org/opentdf-rs", tag = "0.16.1" }
opentdf-kas = { git = "https://github.com/arkavo-org/opentdf-rs", tag = "0.16.1" }
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = { version = "0.10", features = ["pem"] }
sha1 = "0.10"
z85 = "3.0"

# Chain-driven KAS dependencies
subxt = { version = "0.51", features = ["jsonrpsee"] }
twox-hash = "1.6"
blake2 = "0.10"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.7", features = ["derive"] }
ecdsa = { version = "0.16", features = ["verifying"] }
p384 = { version = "0.13", features = ["ecdsa"] }
moka = { version = "0.12", features = ["future"] }
thiserror = "1.0"
async-trait = "0.1"
ciborium = "0.2"
coset = "0.4"
serde_bytes = "0.11"

# RTMP protocol support (using local fork with custom_fields support)
rml_rtmp = { git = "https://github.com/arkavo-org/rust-media-libs.git", tag = "v0.9.0" }
rml_amf0 = { git = "https://github.com/arkavo-org/rust-media-libs.git", tag = "v0.9.0" }
bytes = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2", "charset"] }
url = "2"

# HTTP/3 (QUIC) — optional, enabled by the `http3` feature.
# Versions mirror the proven authnz-rs (identity.arkavo.net) stack.
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11", optional = true }
http-body = { version = "1", optional = true }
http = { version = "1", optional = true }

[features]
default = []
http3 = ["h3", "h3-quinn", "quinn", "http-body", "http"]
fairplay = ["fairplay-wrapper", "libc"]
c2pa_signing = ["c2pa", "mp4parse", "x509-parser", "aws-sdk-kms", "rcgen"]

[dev-dependencies]
criterion = "0.5.1"
serial_test = "3.2.0"
wiremock = "0.6"
# Self-signed certs for the http3 smoke test and the TLS version tests.
rcgen = "0.13"
# Short-lived signer certificates for the C2PA timestamp test.
time = "0.3"

[[bench]]
name = "benchmarks"
harness = false
