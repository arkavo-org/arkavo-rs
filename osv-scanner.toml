# Vulnerability waivers for the CI gate (.github/workflows/security.yaml).
#
# The gate runs osv-scanner over Cargo.lock and fails on any CRITICAL or HIGH
# finding (C2PA Generator Product Security Requirements, O.3 Level 1: fix within
# 90 days of detection; O.6 holds the hosting environment to 30 days for high).
# To accept a finding for a short time, add an [[IgnoredVulns]] entry below.
# Policy, checked by .github/scripts/osv_gate.py:
#
#   * Every waiver records its detection date in `reason`, as "Detected YYYY-MM-DD".
#   * `ignoreUntil` is required and is at most 30 days after the detection date
#     (the O.6 limit for HIGH, which is tighter than the 90 days of O.3; the gate
#     applies it to CRITICAL as well). osv-scanner treats an entry without
#     `ignoreUntil` as permanent; the gate rejects it.
#   * An expired waiver stops hiding the finding, so the gate fails again. Fix the
#     dependency or remove the entry; do not extend the date.
#
# Example (kept as a comment on purpose, the file starts with no waivers):
#
#   [[IgnoredVulns]]
#   id = "<advisory id>"
#   ignoreUntil = 2026-01-31
#   reason = "Detected 2026-01-02. <why arks is not exposed, and the fix plan>"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0344"
ignoreUntil = 2026-11-25
reason = "Detected 2026-10-26. ruzstd 0.8.3 decompression bomb. Reached only through smoldot-light -> subxt-lightclient, subxt's optional light-client feature, which arks does not enable: Cargo.lock lists it but it is not compiled (cargo tree --all-features shows no ruzstd). Fix: subxt release with smoldot on ruzstd >= 0.9.1, or drop subxt (chain validation is off in production)."
